[package]
name = "vlajmaji-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "JSON command-line tools for building and searching (Re)Lojban lexical stores."
keywords = ["lojban", "relojban", "dictionary", "search", "cli"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "vlajmaji"
path = "src/main.rs"
doc = false

[dependencies]
clap.workspace = true
vlajmaji-search = { package = "vlajmaji-search", path = "../search", version = "0.3.0", features = ["morphology"] }
vlajmaji-lexicon.workspace = true
vlajmaji-store.workspace = true
serde_json.workspace = true

[lints]
workspace = true
