[package]
name = "vlajmaji-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Native rebuildable persistence and exact query indexes for Relojban lexical archives."

[features]
default = []
graph = ["dep:oxigraph", "dep:sha2_v11"]

[dependencies]
vlajmaji-lexicon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rusqlite.workspace = true
oxigraph = { workspace = true, optional = true }
sha2_v11 = { package = "sha2", version = "=0.11.0", optional = true }

[lints]
workspace = true

[[example]]
name = "native_probe"
required-features = ["graph"]

