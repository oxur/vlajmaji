[package]
name = "vlajmaji-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Source-preserving lexical search with spelling, phonology, prosody, and compound queries."
keywords = ["lojban", "relojban", "dictionary", "search", "phonology"]
categories = ["text-processing", "science"]
documentation = "https://docs.rs/vlajmaji-search"

[features]
default = []
morphology = ["dep:latkerlo-jvotci"]

[[example]]
name = "full_population_probe"
required-features = ["morphology"]

[dependencies]
vlajmaji-lexicon.workspace = true
vlajmaji-store.workspace = true
bauske-phonology.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strsim.workspace = true
latkerlo-jvotci = { version = "=2.10.2601", optional = true }

[lints]
workspace = true

