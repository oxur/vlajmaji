[workspace]
resolver = "3"
members = ["crates/*", "crate/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
relojban-phonology = { path = "../../../Library/Application Support/ChatGPT-Profiles/personal/codex-home/.chatgpt-projects/g-p-6a8c72d334048191887d4e00472f8430/relojban-poetics/crates/relojban-phonology" }
vlajmaji-lexicon = { path = "crates/lexicon" }
vlajmaji-store = { path = "crates/store" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value", "arbitrary_precision"] }
sha2 = "=0.10.9"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
oxigraph = "=0.5.13"
strsim = "=0.11.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
